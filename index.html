<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover">
<title>店内マップエディタ</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1e1e1e">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="stylesheet" href="style.css">
</head>
<body>

<canvas id="canvas"></canvas>

<div id="toolbar-tl" class="toolbar">
  <button id="btn-mode" class="tbtn" title="ペンシルモード(タップで切替)">
    <svg viewBox="0 0 24 24"><path d="M4 20l1-4L16 5l3 3L8 19l-4 1z" fill="none" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M14 7l3 3" fill="none" stroke-width="1.6"/></svg>
  </button>
  <button id="btn-save" class="tbtn" title="保存・読み込み">
    <svg viewBox="0 0 24 24"><path d="M5 3h11l5 5v13a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1z"/><path d="M8 3v6h8V3M8 21v-7h8v7" fill="none" stroke-width="1.6"/></svg>
  </button>
  <input type="file" id="file-input" accept="application/json" hidden>
  <button id="btn-undo" class="tbtn" title="元に戻す" disabled>
    <svg viewBox="0 0 24 24"><path d="M7 7H15a5 5 0 0 1 0 10h-3" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M10 3 5 7l5 4" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
  </button>
  <button id="btn-redo" class="tbtn" title="やり直す" disabled>
    <svg viewBox="0 0 24 24"><path d="M17 7H9a5 5 0 0 0 0 10h3" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M14 3l5 4-5 4" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
  </button>
  <button id="btn-search" class="tbtn" title="検索">
    <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7" fill="none" stroke-width="1.8"/><path d="M21 21l-4.3-4.3" fill="none" stroke-width="1.8" stroke-linecap="round"/></svg>
  </button>
  <button id="btn-select-all" class="tbtn" title="全選択">
    <svg viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="2" fill="none" stroke-width="1.7"/><path d="M8 12l3 3 5-6" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
  </button>
  <button id="btn-delete" class="tbtn" title="削除">
    <svg viewBox="0 0 24 24"><path d="M5 7h14M9 7V5a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2m-8 0v13a1 1 0 0 0 1 1h6a1 1 0 0 0 1-1V7" fill="none" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/><path d="M10 11v6M14 11v6" fill="none" stroke-width="1.7" stroke-linecap="round"/></svg>
  </button>
</div>

<div id="toolbar-tr" class="toolbar">
  <button id="btn-settings" class="tbtn" title="設定">
    <svg viewBox="0 0 24 24"><path d="M12 15.5A3.5 3.5 0 1 0 12 8.5a3.5 3.5 0 0 0 0 7z" fill="none" stroke-width="1.6"/><path d="M19.4 13a7.6 7.6 0 0 0 0-2l2-1.6-2-3.4-2.4 1a7.7 7.7 0 0 0-1.7-1L15 3h-4l-.3 2.6a7.7 7.7 0 0 0-1.7 1l-2.4-1-2 3.4L6.6 11a7.6 7.6 0 0 0 0 2l-2 1.6 2 3.4 2.4-1a7.7 7.7 0 0 0 1.7 1L11 21h4l.3-2.6a7.7 7.7 0 0 0 1.7-1l2.4 1 2-3.4-2-1.6z" fill="none" stroke-width="1.6"/></svg>
  </button>
  <button id="btn-help" class="tbtn" title="このアプリについて">
    <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" fill="none" stroke-width="1.6"/><path d="M9.4 9.3a2.6 2.6 0 0 1 5 .9c0 1.6-1.7 2-2.3 2.9-.2.3-.3.6-.3 1" fill="none" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><circle cx="12" cy="16.8" r="0.9" stroke="none"/></svg>
  </button>
  <button id="btn-fullscreen" class="tbtn" title="フルスクリーン">
    <svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5" fill="none" stroke-width="1.8"/></svg>
  </button>
</div>

<!-- 検索メニュー(検索ボタンの下に表示) -->
<div id="search-menu" class="popup context-menu search-menu hidden">
  <div class="search-row">
    <input type="text" id="search-input" placeholder="文字を含む四角を検索" enterkeyhint="search">
    <button id="search-go" class="search-go-btn" title="検索">
      <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7" fill="none" stroke-width="1.8"/><path d="M21 21l-4.3-4.3" fill="none" stroke-width="1.8" stroke-linecap="round"/></svg>
    </button>
  </div>
</div>

<!-- モード切替メニュー(モードボタンの下に表示) -->
<div id="mode-menu" class="popup context-menu mode-menu hidden">
  <div class="mode-menu-title">モードを切り替え</div>
</div>

<div id="zoom-indicator" class="hidden"></div>

<!-- 保存/読み込みメニュー(保存ボタンの下に表示) -->
<div id="save-menu" class="popup context-menu hidden">
  <button id="save-png" class="popup-btn">画像として保存 (PNG)</button>
  <button id="save-json" class="popup-btn">データとして保存 (JSON)</button>
  <button id="share-png" class="popup-btn">画像として共有 (PNG)</button>
  <button id="share-json" class="popup-btn">データとして共有 (JSON)</button>
  <button id="load-json" class="popup-btn">読み込み (JSON)</button>
</div>

<!-- 設定パネル -->
<div id="settings-panel" class="popup hidden">
  <div class="popup-title">設定</div>
  <label class="field">
    グリッド間隔
    <div class="field-row">
      <input type="range" id="grid-size-range" min="12" max="80" step="1">
      <span id="grid-size-value"></span>
    </div>
  </label>
  <button id="settings-clear" class="popup-btn danger">キャンバスを全消去</button>
  <button class="popup-close" data-close="settings-panel">閉じる</button>
</div>

<!-- テキスト編集オーバーレイ -->
<div id="text-edit-overlay" class="hidden">
  <div class="text-edit-box">
    <div class="popup-title">テキストを入力</div>
    <textarea id="text-edit-input" placeholder="例）レジ、バックヤード…"></textarea>
    <div class="text-edit-buttons">
      <button id="text-edit-delete" class="popup-btn danger">この四角を削除</button>
      <div class="spacer"></div>
      <button id="text-edit-cancel" class="popup-btn">キャンセル</button>
      <button id="text-edit-ok" class="popup-btn primary">OK</button>
    </div>
  </div>
</div>

<!-- アプリ更新の確認ダイアログ -->
<div id="update-dialog" class="popup hidden">
  <div class="popup-title">アップデートがあります</div>
  <p class="update-desc">新しいバージョンが公開されました。今すぐ更新しますか?</p>
  <button id="update-now" class="popup-btn primary">今すぐ更新</button>
  <button id="update-later" class="popup-btn">後で</button>
</div>

<!-- 四角の右クリック/長押しメニュー -->
<div id="rect-context-menu" class="popup context-menu hidden">
  <button id="ctx-rotate-right" class="popup-btn">右へ回転</button>
  <button id="ctx-rotate-left" class="popup-btn">左へ回転</button>
  <button id="ctx-bring-front" class="popup-btn">最前面に移動</button>
  <button id="ctx-send-back" class="popup-btn">最背面に移動</button>
  <button id="ctx-copy" class="popup-btn">コピー</button>
  <button id="ctx-cut" class="popup-btn">切り取り</button>
</div>

<!-- キャンバスの右クリック/長押しメニュー(四角のない場所) -->
<div id="canvas-context-menu" class="popup context-menu hidden">
  <button id="ctx-canvas-rotate-right" class="popup-btn">キャンバスを右に90度回転</button>
  <button id="ctx-canvas-rotate-left" class="popup-btn">キャンバスを左に90度回転</button>
  <button id="ctx-canvas-paste" class="popup-btn hidden">貼り付け</button>
</div>

<div id="hint" class="hint"></div>

<!-- 回転アニメーション中に入力をブロックする全画面オーバーレイ -->
<div id="rotation-lock" class="hidden"></div>

<script src="app.js"></script>
</body>
</html>
